name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm_build:
        description: 'Build and verify the Windows EXE and ZIP'
        type: boolean
        default: false
      confirm_publish:
        description: 'Publish the ZIP to the selected version tag (also requires confirm_build)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      PROVIDENCE_MODEL_DIR: ${{ github.workspace }}/build/model
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release version and explicit approvals
        env:
          CONFIRM_BUILD: ${{ inputs.confirm_build }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }
          if (-not (Test-Path -LiteralPath "docs/releases/$version.md")) {
            throw "Write the release summary in docs/releases/$version.md before tagging"
          }
          if ($env:CONFIRM_PUBLISH -eq 'true' -and ($env:CONFIRM_BUILD -ne 'true' -or $env:GITHUB_REF_TYPE -ne 'tag')) {
            throw 'Publishing requires confirm_build and a matching version tag'
          }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'Updating pip failed' }
          .venv/Scripts/python.exe -m pip install -r requirements-windows.txt --extra-index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'Installing dependencies failed' }
          .venv/Scripts/python.exe -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw 'Installing Providence failed' }
      - name: Download the pinned offline model
        run: |
          .venv/Scripts/python.exe docker/download_model.py --destination build/model
          if ($LASTEXITCODE -ne 0) { throw 'Downloading model failed' }
          .venv/Scripts/python.exe scripts/download-qwen.py --destination build/qwen
          if ($LASTEXITCODE -ne 0) { throw 'Downloading Qwen model failed' }
          .venv/Scripts/python.exe scripts/download-clip.py --destination build/clip
          if ($LASTEXITCODE -ne 0) { throw 'Downloading image model failed' }
      - name: Run UI, indexing and offline model tests
        run: |
          .venv/Scripts/python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build and verify the portable app
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_build
        run: ./scripts/build-windows.ps1
      - name: Test native Windows startup
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_build
        run: |
          Remove-Item Env:QT_QPA_PLATFORM
          ./scripts/verify-desktop-windows.ps1
      - name: Keep the ZIP and checksum
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_build
        uses: actions/upload-artifact@v7
        with:
          name: Providence-win-x64
          path: |
            dist/Providence-win-x64.zip
            dist/Providence-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_build && inputs.confirm_publish && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Providence-win-x64
          path: release
      - name: Publish the downloadable Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          summary="docs/releases/${RELEASE_TAG#v}.md"
          test -s "$summary"
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq '.body' > release/generated-notes.md
          { cat "$summary"; printf '\n\n'; cat release/generated-notes.md; } > release/release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/Providence-win-x64.zip release/Providence-win-x64.zip.sha256 --clobber
            gh release edit "$RELEASE_TAG" --notes-file release/release-notes.md --title "Providence $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" release/Providence-win-x64.zip release/Providence-win-x64.zip.sha256 --verify-tag --notes-file release/release-notes.md --title "Providence $RELEASE_TAG"
          fi
