services:
  providence:
    build:
      context: .
      target: desktop
    image: providence:local
    environment:
      PROVIDENCE_LIBRARY_SOURCE: ${PROVIDENCE_DOCUMENTS:-demo-documents}
    volumes:
      - providence-data:/data
      - type: bind
        source: ${PROVIDENCE_DOCUMENTS:-./demo-documents}
        target: /documents
        read_only: true
    networks:
      - offline
    init: true
    shm_size: 256mb
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  desktop-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: providence:gateway
    ports:
      - "127.0.0.1:6080:6080"
    networks:
      - offline
      - browser
    depends_on:
      providence:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    image: providence:test
    network_mode: none
    environment:
      PROVIDENCE_DATA_DIR: /tmp/providence-tests

volumes:
  providence-data:

networks:
  offline:
    internal: true
  browser:
