[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "providence-search"
version = "0.1.0"
description = "Offline semantic search for personal documents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "torch>=2.6,<3",
  "transformers>=4.41,<6",
  "PyMuPDF>=1.25,<2",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
providence = "providence.__main__:main"

[tool.setuptools.packages.find]
include = ["providence*"]

[tool.setuptools.package-data]
providence = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
