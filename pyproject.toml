[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "providence-search"
version = "1.0.3"
description = "Offline semantic search for personal documents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "torch>=2.6,<3",
  "transformers>=4.41,<6",
  "PyMuPDF>=1.25,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1,<2",
  "numpy>=2,<3",
  "watchdog>=6,<7",
  "usearch>=2.26,<3",
  "rapidocr==3.10.0",
  "onnxruntime>=1.20,<2",
  "Pillow>=11,<13",
  "pillow-heif>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
providence = "providence.__main__:main"

[tool.setuptools.packages.find]
include = ["providence*"]

[tool.setuptools.package-data]
providence = ["assets/*.png", "assets/*.ico", "qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep fixtures outside AppData/Temp, which file discovery intentionally excludes.
# Pytest creates this repository-level disposable directory before each run.
addopts = "--basetemp=pytest-tmp"
